<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balloons</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container" id="container">
    <div class="cloud" style="top: 10%; animation-duration: 120s; animation-delay: -40s;"></div>
    <div class="cloud" style="top: 22%; animation-duration: 160s; animation-delay: -50s;"></div>
    <div class="cloud" style="top: 34%; animation-duration: 200s; animation-delay: -280s;"></div>
    <div class="cloud" style="top: 46%; animation-duration: 140s; animation-delay: -100s;"></div>
    <div class="cloud" style="top: 58%; animation-duration: 180s; animation-delay: -300s;"></div>
    <div class="cloud" style="top: 70%; animation-duration: 100s; animation-delay: -50s;"></div>
  </div>
  <button popovertarget="settingsPopover" id="settingsButton" title="Settings">⚙️</button>
  <div id="settingsPopover" popover class="popover-content">
    <button id="bgMusicToggle" class="toggle-button" aria-pressed="false" title="Toggle Background Music">🔇</button>
    <p>
      Music credits: <a href="https://freetouse.com/music/aylex/happy-day">Happy Day by Aylex</a>
      <br>
      Sound effects credits: <a href="https://pixabay.com/sound-effects/sharp-pop-328170/">Sharp Pop by CreatorsHome</a>
    </p>
  </div>
  <audio id="bgMusic" src="Aylex - Happy Day (freetouse.com).mp3" loop preload="auto"></audio>
  <audio id="popSound" src="sharp-pop-328170.mp3" preload="auto"></audio>
  <script src="script.js"></script>
</body>
</html>
