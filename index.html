<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Balloons</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#87ceeb">
</head>
<body>
  <div class="container" id="container">
    <div class="cloud" style="top: 10%; animation-duration: 120s; animation-delay: -40s;"></div>
    <div class="cloud" style="top: 22%; animation-duration: 160s; animation-delay: -50s;"></div>
    <div class="cloud" style="top: 34%; animation-duration: 200s; animation-delay: -280s;"></div>
    <div class="cloud" style="top: 46%; animation-duration: 140s; animation-delay: -100s;"></div>
    <div class="cloud" style="top: 58%; animation-duration: 180s; animation-delay: -300s;"></div>
    <div class="cloud" style="top: 70%; animation-duration: 100s; animation-delay: -50s;"></div>
  </div>
  <button popovertarget="settingsPopover" id="settingsButton" title="Settings">⚙️</button>
  <div id="settingsPopover" popover class="popover-content">
    <label class="music-toggle" title="Toggle Background Music">
      <span class="icon">🔈</span>
      <input type="checkbox" id="bgMusicToggle">
      <span class="slider">
        <span class="thumb"></span>
      </span>
      <span class="icon">🔊</span>
    </label>
    <details class="credits">
      <summary>Sound credits</summary>
      <p>
        Music: <a href="https://freetouse.com/music/aylex/happy-day">Happy Day by Aylex</a>
        <br>
        Effects: <a href="https://pixabay.com/sound-effects/sharp-pop-328170/">Sharp Pop by CreatorsHome</a>
      </p>
    </details>
  </div>
  <audio id="bgMusic" src="assets/Aylex - Happy Day (freetouse.com).mp3" loop preload="auto"></audio>
  <audio id="popSound" src="assets/sharp-pop-328170.mp3" preload="auto"></audio>
  <script src="script.js"></script>
</body>
</html>
